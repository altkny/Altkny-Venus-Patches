name: Integrate QoL source
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Integrate hooks
        run: |
          python3 scripts/integrate_qol.py
          python3 scripts/integrate_qol_more.py
          python3 scripts/integrate_quest_dashboard.py
      - name: Update experimental QoL translations
        run: python3 scripts/qol_i18n.py
      - name: Validate JavaScript syntax
        run: |
          sed 's@/\*__FEATURES__\*/@{}@' patches/src/main/resources/venus/bootstrap.js > /tmp/venus-bootstrap-check.js
          node --check /tmp/venus-bootstrap-check.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/src/main/resources/venus/bootstrap.js patches/src/main/resources/venus/i18n/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Integrate additional QoL hooks into Venus bootstrap"
            git push
          fi
